name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"  # weekly, so the demo's "N hours ago" stays recent
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the static demo from real demo traffic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[demo]"
      - name: Generate demo traces and export the viewer
        env:
          DATABASE_URL: sqlite:///./site.db
        run: |
          genai-traces demo --direct
          genai-traces export-static _site
          test -f _site/index.html && test -f _site/data/stats.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

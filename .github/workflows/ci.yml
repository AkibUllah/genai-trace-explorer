name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check genai_traces tests
          ruff format --check genai_traces tests
      - name: Test (SQLite)
        run: pytest --cov=genai_traces --cov-report=term-missing

  postgres:
    name: full suite on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traces
          POSTGRES_PASSWORD: traces
          POSTGRES_DB: traces
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traces" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://traces:traces@localhost:5432/traces
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Store, ingest and API tests on a real database
        run: pytest -v

  docker:
    name: docker build + OTLP smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: genai-trace-explorer:ci
      - name: Send demo traffic to the container over OTLP/HTTP
        run: |
          docker run -d --name collector -p 4318:4318 genai-trace-explorer:ci
          for i in $(seq 1 30); do curl -fsS localhost:4318/health && break; sleep 1; done
          docker exec collector genai-traces demo --conversations 5 --faq 5 --hours 6
          curl -fsS localhost:4318/health | tee health.json
          python3 -c "import json,sys; h=json.load(open('health.json')); sys.exit(0 if h['traces'] > 0 else 1)"

# Render blueprint: collector + viewer with a managed PostgreSQL.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: genai-trace-explorer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "4318"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: genai-traces-db
          property: connectionString
      - key: INGEST_TOKEN
        generateValue: true
      - key: READ_TOKEN
        generateValue: true

databases:
  - name: genai-traces-db
    plan: free
    databaseName: traces
    user: traces
